<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Stock & Exchange Rate Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💼 Stock & Exchange Rate Tracker</h1>
            <p class="last-updated">Last updated: <span id="lastUpdate">Loading...</span></p>
        </header>

        <div class="dashboard">
            <!-- Exchange Rate Section -->
            <section class="card exchange-rate-card">
                <h2>💱 USD/KRW Exchange Rate</h2>
                <div class="rate-display">
                    <div class="rate-value" id="exchangeRate">Loading...</div>
                    <div class="rate-change" id="rateChange">--</div>
                </div>
                <p class="rate-timestamp" id="rateTime">Last updated: --</p>
            </section>

            <!-- Portfolio Summary -->
            <section class="card summary-card">
                <h2>📊 Portfolio Summary</h2>
                <div class="summary-stats">
                    <div class="stat">
                        <label>Total Holdings:</label>
                        <span id="totalHoldings">0</span>
                    </div>
                    <div class="stat">
                        <label>Portfolio Value (USD):</label>
                        <span id="portfolioValue">$0.00</span>
                    </div>
                    <div class="stat">
                        <label>Portfolio Value (KRW):</label>
                        <span id="portfolioValueKRW">₩0</span>
                    </div>
                </div>
            </section>

            <!-- Stocks Table -->
            <section class="card stocks-card">
                <h2>📈 Your Stocks</h2>
                <table id="stocksTable">
                    <thead>
                        <tr>
                            <th>Symbol</th>
                            <th>Quantity</th>
                            <th>Price (USD)</th>
                            <th>Total Value (USD)</th>
                            <th>Total Value (KRW)</th>
                        </tr>
                    </thead>
                    <tbody id="stocksBody">
                        <tr><td colspan="5">Loading stocks...</td></tr>
                    </tbody>
                </table>
            </section>
        </div>
    </div>

    <script src="script.js?v=2"></script>
</body>
</html>
